name: Public Core Release Bootstrap

on:
  push:
    branches:
      - release/public-core-s0-s1-v1

permissions:
  contents: write

jobs:
  restore-frozen-lock-offline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MANIFEST_SHA256: c454ba079de7aac25f51b4f06052dc658854317cd3edb2decd4004cb1db7d20e
      UV_LOCK_GZIP_SHA256: 1319576ee68dc5d9a4601e0dd4bba9da96741fb9f44c3aecb5f0e35814d36625
      UV_LOCK_SHA256: 37267c6369be88608eecce1cf251dab0df2ea615131b5efbed1eb89425fb05a5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify frozen transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              'uv_lock_gz_b64.part-00': 'ad77e3693042f67d84853de3aca986f17d8b19119a0a2a2bcbaad7a0759ae480',
              'uv_lock_gz_b64.part-01': '07639b657fbf4c01f8ce0fc30c4f23b52f3cbf0bcd1b65e75fae90bc6f013bb2',
              'uv_lock_gz_b64.part-02': 'fe37ffbc816f43f607952bee6e0ed6fb2fbd055ee49648b49404abd57dda30db',
              'uv_lock_gz_b64.part-03': 'cbfeab30ae59ba7192062cc5ee1f23ee3081d0e8271fc08d5bcbcbba018070e3',
              'uv_lock_gz_b64.part-04': '1157fa994b1c921f7e86cfca9b1de0504fe615e95dd3ae1d736448f170400250',
              'uv_lock_gz_b64.part-05': 'ac587f5d23a4f663e4532f858457900fc13307de6ef6d1cb05219b87f5517469',
              'uv_lock_gz_b64.part-06': 'f7a9c9bc672cbf3781eca2a4cf78fbe61088addfe68a719fcf539f859bb442bb',
              'uv_lock_gz_b64.part-07': '0180fc6ae3f9ac2091e48527b312a7ec270caf6f888febdfa2116247866476f4',
              'uv_lock_gz_b64.part-08': '19858fd25fc860bb606e22b39a4e185786ebfc73fb7ef64a1913a1a57e4d2a0b',
              'uv_lock_gz_b64.part-09': '3851124709a3ca4e9b0c1079f41804f59bc9b744d360ed15443138c9ef47a3be',
              'uv_lock_gz_b64.part-10': '7fd18bdc9797bbb95a1fdb033597abb73088954ab9e2f51565d514acebf5598e',
              'uv_lock_gz_b64.part-11': 'a5042a408f2224d2c9d240bdabe90c6cfb6079a52b2514beb84587a41a92ec5a',
          }
          root = Path('.release')
          actual = {p.name for p in root.glob('uv_lock_gz_b64.part-*') if p.is_file()}
          if actual != set(expected):
              raise SystemExit(f'chunk set mismatch: actual={sorted(actual)}')
          for name, want in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'chunk hash mismatch: {name}: {got} != {want}')
          print('Transfer chunks: PASS (12/12)')
          PY

      - name: Reconstruct exact frozen uv.lock offline
        shell: bash
        run: |
          set -euo pipefail
          cat .release/uv_lock_gz_b64.part-* > /tmp/uv.lock.gz.b64
          base64 --decode /tmp/uv.lock.gz.b64 > /tmp/uv.lock.gz
          echo "$UV_LOCK_GZIP_SHA256  /tmp/uv.lock.gz" | sha256sum -c -
          gzip -dc /tmp/uv.lock.gz > uv.lock
          echo "$UV_LOCK_SHA256  uv.lock" | sha256sum -c -
          test "$(wc -c < uv.lock)" -eq 270530

      - name: Verify frozen manifest and all manifest files
        shell: bash
        run: |
          set -euo pipefail
          echo "$MANIFEST_SHA256  PUBLIC_CORE_MANIFEST.json" | sha256sum -c -
          sha256sum -c PUBLIC_CORE_MANIFEST.sha256
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'PUBLIC_CORE_MANIFEST.json').read_text(encoding='utf-8'))
          bad = []
          for item in manifest['files']:
              path = root / item['path']
              if not path.is_file():
                  bad.append((item['path'], 'missing'))
                  continue
              data = path.read_bytes()
              if len(data) != item['bytes']:
                  bad.append((item['path'], f"bytes={len(data)} expected={item['bytes']}"))
                  continue
              got = hashlib.sha256(data).hexdigest()
              if got != item['sha256']:
                  bad.append((item['path'], f"sha256={got} expected={item['sha256']}"))
          if bad:
              for row in bad:
                  print(row)
              raise SystemExit('manifest file verification failed')
          print(f"Manifest file hashes: PASS ({len(manifest['files'])}/71)")
          PY

      - name: Remove transfer-only files and verify exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm .github/workflows/release-bootstrap.yml
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'PUBLIC_CORE_MANIFEST.json').read_text(encoding='utf-8'))
          expected = {item['path'] for item in manifest['files']}
          expected |= {'PUBLIC_CORE_MANIFEST.json', 'PUBLIC_CORE_MANIFEST.sha256'}
          actual = {
              str(p.relative_to(root))
              for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts
          }
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          if missing or extra:
              print('missing=', missing)
              print('extra=', extra)
              raise SystemExit('final tree path mismatch')
          print(f'Final tree paths: PASS ({len(actual)} files)')
          PY

      - name: Commit exact final Public Core tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Civilization-Leap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          echo 'Finalization delta:'
          git diff --cached --name-status
          test -f uv.lock
          test ! -e .release
          test ! -e .github/workflows/release-bootstrap.yml
          git commit -m 'release(public-core): finalize exact audited S0/S1 snapshot'
          git push origin HEAD:release/public-core-s0-s1-v1
