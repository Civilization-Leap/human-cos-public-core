name: Public Core Release Bootstrap

on:
  push:
    branches:
      - release/public-core-s0-s1-v1

permissions:
  contents: write

jobs:
  restore-frozen-lock:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1a1c-8210-bdb4-6d3ad6811ab8/raw?se=2026-08-24T00%3A01%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=bac452e5-31f8-535f-b6ba-971ba337b0ab&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T22%3A36%3A30Z&ske=2026-08-24T22%3A36%3A30Z&sks=b&skv=2026-02-06&sig=uVPXtLG7OUL/FK2aR%2BLuL46ROlxJJ0f4Gd66nJIFFe0%3D'
      SNAPSHOT_SHA256: '738885d174edd641b66afec672945f46325f02b376d1af9e586cff32a3e74709'
      MANIFEST_SHA256: 'c454ba079de7aac25f51b4f06052dc658854317cd3edb2decd4004cb1db7d20e'
      UV_LOCK_SHA256: '37267c6369be88608eecce1cf251dab0df2ea615131b5efbed1eb89425fb05a5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify pre-restore tree against frozen manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path('.')
          manifest_path = root / 'PUBLIC_CORE_MANIFEST.json'
          got = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          expected = 'c454ba079de7aac25f51b4f06052dc658854317cd3edb2decd4004cb1db7d20e'
          if got != expected:
              raise SystemExit(f'manifest drift: {got} != {expected}')
          m = json.loads(manifest_path.read_text(encoding='utf-8'))
          bad=[]
          for item in m['files']:
              p=root/item['path']
              if item['path']=='uv.lock':
                  if p.exists(): bad.append(('uv.lock','unexpectedly present before restore'))
                  continue
              if not p.is_file():
                  bad.append((item['path'],'missing')); continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h != item['sha256']: bad.append((item['path'],h))
          if bad:
              print(bad)
              raise SystemExit('pre-restore manifest mismatch')
          print('Pre-restore manifest check: PASS')
          PY

      - name: Retrieve previously audited frozen release artifact
        run: |
          curl --fail --location --retry 3 --output /tmp/release-artifact.zip "$ARTIFACT_URL"
          unzip -q /tmp/release-artifact.zip -d /tmp/release-artifact
          test -f /tmp/release-artifact/human-cos-public-core_final_clean_snapshot.zip
          echo "$SNAPSHOT_SHA256  /tmp/release-artifact/human-cos-public-core_final_clean_snapshot.zip" | sha256sum -c -

      - name: Restore exact uv.lock and verify full frozen snapshot
        run: |
          unzip -p /tmp/release-artifact/human-cos-public-core_final_clean_snapshot.zip uv.lock > uv.lock
          echo "$UV_LOCK_SHA256  uv.lock" | sha256sum -c -
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'PUBLIC_CORE_MANIFEST.json').read_text(encoding='utf-8'))
          bad=[]
          for item in m['files']:
              p=root/item['path']
              if not p.is_file(): bad.append((item['path'],'missing')); continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h != item['sha256']: bad.append((item['path'],h))
          if bad:
              print(bad)
              raise SystemExit('full manifest mismatch')
          print(f"Full manifest check: PASS ({len(m['files'])} files)")
          PY

      - name: Remove one-time bootstrap and commit exact final tree
        run: |
          rm .github/workflows/release-bootstrap.yml
          git config user.name 'Civilization-Leap'
          git config user.email 'actions@users.noreply.github.com'
          git add uv.lock .github/workflows/release-bootstrap.yml
          git diff --cached --name-status
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/release-bootstrap.yml uv.lock "
          git commit -m 'release(public-core): restore frozen uv.lock and finalize exact S0/S1 snapshot'
          git push origin HEAD:release/public-core-s0-s1-v1
