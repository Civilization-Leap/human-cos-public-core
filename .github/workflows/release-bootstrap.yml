name: Public Core Release Bootstrap

on:
  push:
    branches:
      - release/public-core-s0-s1-v1

permissions:
  contents: write

jobs:
  restore-frozen-lock-offline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MANIFEST_SHA256: c454ba079de7aac25f51b4f06052dc658854317cd3edb2decd4004cb1db7d20e
      UV_LOCK_GZIP_SHA256: 1319576ee68dc5d9a4601e0dd4bba9da96741fb9f44c3aecb5f0e35814d36625
      UV_LOCK_SHA256: 37267c6369be88608eecce1cf251dab0df2ea615131b5efbed1eb89425fb05a5
      LICENSE_SHA256: 325648a2d789644d9f57e7b102adc897d85127a25dbecfff251ffbe73f76b7f7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair the single-byte transfer defect deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.release')
          expected_names = {f'uv_lock_gz_b64.part-{i:02d}' for i in range(12)}
          actual_names = {p.name for p in root.glob('uv_lock_gz_b64.part-*') if p.is_file()}
          if actual_names != expected_names:
              raise SystemExit(f'chunk set mismatch: actual={sorted(actual_names)}')

          p = root / 'uv_lock_gz_b64.part-02'
          want = 'fe37ffbc816f43f607952bee6e0ed6fb2fbd055ee49648b49404abd57dda30db'
          raw = p.read_bytes()
          got = hashlib.sha256(raw).hexdigest()
          if got == want:
              print('part-02 already exact; no repair needed')
          else:
              if len(raw) != 9259:
                  raise SystemExit(f'part-02 unexpected length: {len(raw)}')
              alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              matches = []
              for pos in range(len(raw) + 1):
                  prefix = hashlib.sha256()
                  prefix.update(raw[:pos])
                  suffix = raw[pos:]
                  for ch in alphabet:
                      h = prefix.copy()
                      h.update(bytes((ch,)))
                      h.update(suffix)
                      if h.hexdigest() == want:
                          matches.append((pos, ch))
                  if len(matches) > 1:
                      break
              if len(matches) != 1:
                  raise SystemExit(f'part-02 repair must be unique; matches={matches}')
              pos, ch = matches[0]
              repaired = raw[:pos] + bytes((ch,)) + raw[pos:]
              if len(repaired) != 9260 or hashlib.sha256(repaired).hexdigest() != want:
                  raise SystemExit('part-02 deterministic repair verification failed')
              p.write_bytes(repaired)
              print(f'part-02 repaired uniquely at byte {pos}; SHA-256 exact')
          PY

      - name: Reconstruct exact frozen uv.lock and verify end-to-end hashes
        shell: bash
        run: |
          set -euo pipefail
          cat .release/uv_lock_gz_b64.part-* > /tmp/uv.lock.gz.b64
          base64 --decode /tmp/uv.lock.gz.b64 > /tmp/uv.lock.gz
          echo "$UV_LOCK_GZIP_SHA256  /tmp/uv.lock.gz" | sha256sum -c -
          gzip -dc /tmp/uv.lock.gz > uv.lock
          echo "$UV_LOCK_SHA256  uv.lock" | sha256sum -c -
          test "$(wc -c < uv.lock)" -eq 270530

      - name: Repair the frozen Apache-2.0 text omission deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          p = Path('LICENSE')
          want = '325648a2d789644d9f57e7b102adc897d85127a25dbecfff251ffbe73f76b7f7'
          data = p.read_bytes()
          if hashlib.sha256(data).hexdigest() == want:
              print('LICENSE already exact; no repair needed')
          else:
              old = b'You may add Your own attribution notices within Derivative Works, alongside'
              new = b'You may add Your own attribution notices within Derivative Works that You distribute, alongside'
              if data.count(old) != 1:
                  raise SystemExit(f'LICENSE deterministic repair anchor count={data.count(old)}')
              fixed = data.replace(old, new, 1)
              if len(fixed) != 10258:
                  raise SystemExit(f'LICENSE repaired length={len(fixed)} expected=10258')
              got = hashlib.sha256(fixed).hexdigest()
              if got != want:
                  raise SystemExit(f'LICENSE repaired SHA-256={got} expected={want}')
              p.write_bytes(fixed)
              print('LICENSE deterministic repair: PASS (10258 bytes; frozen SHA-256 exact)')
          PY

      - name: Verify frozen manifest and all manifest files
        shell: bash
        run: |
          set -euo pipefail
          echo "$MANIFEST_SHA256  PUBLIC_CORE_MANIFEST.json" | sha256sum -c -
          sha256sum -c PUBLIC_CORE_MANIFEST.sha256
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'PUBLIC_CORE_MANIFEST.json').read_text(encoding='utf-8'))
          bad = []
          for item in manifest['files']:
              path = root / item['path']
              if not path.is_file():
                  bad.append((item['path'], 'missing'))
                  continue
              data = path.read_bytes()
              if len(data) != item['bytes']:
                  bad.append((item['path'], f"bytes={len(data)} expected={item['bytes']}"))
                  continue
              got = hashlib.sha256(data).hexdigest()
              if got != item['sha256']:
                  bad.append((item['path'], f"sha256={got} expected={item['sha256']}"))
          if bad:
              for row in bad:
                  print(row)
              raise SystemExit('manifest file verification failed')
          if len(manifest['files']) != 71:
              raise SystemExit(f"manifest file count drift: {len(manifest['files'])}")
          print('Manifest file hashes: PASS (71/71)')
          PY

      - name: Remove transfer-only material and verify exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm .github/workflows/release-bootstrap.yml
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'PUBLIC_CORE_MANIFEST.json').read_text(encoding='utf-8'))
          expected = {item['path'] for item in manifest['files']}
          expected |= {'PUBLIC_CORE_MANIFEST.json', 'PUBLIC_CORE_MANIFEST.sha256'}
          actual = {
              str(p.relative_to(root))
              for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts
          }
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          if missing or extra:
              print('missing=', missing)
              print('extra=', extra)
              raise SystemExit('final tree path mismatch')
          if len(actual) != 73:
              raise SystemExit(f'final file-count drift: {len(actual)}')
          print('Final tree paths: PASS (73/73)')
          PY

      - name: Commit exact final Public Core tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Civilization-Leap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          echo 'Finalization delta:'
          git diff --cached --name-status
          test -f uv.lock
          test ! -e .release
          test ! -e .github/workflows/release-bootstrap.yml
          git commit -m 'release(public-core): finalize exact audited S0/S1 snapshot'
          git push origin HEAD:release/public-core-s0-s1-v1
