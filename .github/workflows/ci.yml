name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: human_cos
          POSTGRES_PASSWORD: human_cos
          POSTGRES_DB: human_cos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U human_cos -d human_cos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUMAN_COS_TEST_DATABASE_URL: postgresql://human_cos:human_cos@localhost:5432/human_cos_test
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # P0-1: install from the FROZEN lockfile, never from live ranges.
      - name: Sync frozen lockfile (incl. dev group)
        run: uv sync --extra dev --frozen

      - name: Unit + protocol + frozen-contract tests
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff format --check)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        run: uv run mypy src/human_cos

      - name: CLI smoke
        run: |
          uv run human-cos-protocols load protocols/protocol_registry_v0.1.yaml
          uv run human-cos-protocols load

      # P0-3: any byte change to the 10 signed contract files fails here.
      - name: Frozen contract hash gate
        run: uv run pytest -q tests/protocol/test_frozen_contract.py tests/protocol/test_packaged_resources.py

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Clean non-editable wheel validation
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/human_cos_runtime-*.whl)"
          env_dir="${RUNNER_TEMP}/human-cos-wheel-${{ matrix.python-version }}"
          requirements="${RUNNER_TEMP}/human-cos-wheel-${{ matrix.python-version }}.txt"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$requirements"
          uv venv "$env_dir" --python "${{ matrix.python-version }}"
          uv pip install --python "$env_dir/bin/python" -r "$requirements"
          uv pip install --python "$env_dir/bin/python" --no-deps "$wheel"
          (
            cd "$RUNNER_TEMP"
            "$env_dir/bin/human-cos-protocols" load
            HUMAN_COS_TEST_DATABASE_URL="$HUMAN_COS_TEST_DATABASE_URL" \
              "$env_dir/bin/python" "$GITHUB_WORKSPACE/tests/integration/wheel_smoke.py"
          )

      - name: Secret scan
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ; then
            echo "Potential secret committed to repository." >&2; exit 1
          fi
          echo "Secret scan: clean"

      - name: Docker build (contract import works from clean image)
        run: docker build -t human-cos-runtime:s0 .
