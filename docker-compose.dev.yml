# Local development stack for Human-COS Runtime (S0).
# PostgreSQL is declared for S1 onward; no service is required by S0 tests.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: human_cos
      POSTGRES_PASSWORD: human_cos
      POSTGRES_DB: human_cos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U human_cos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
